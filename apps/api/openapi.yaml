openapi: 3.0.3
info:
  title: 'larachat API'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Auth
    description: 'Sign up, log in, log out. Call GET /sanctum/csrf-cookie before the first write.'
  -
    name: Account
    description: 'The logged-in user.'
  -
    name: People
    description: 'Finding other users.'
components:
  securitySchemes:
    default:
      type: apiKey
      name: X-XSRF-TOKEN
      in: header
      description: 'Sanctum SPA cookie auth: call <code>GET /sanctum/csrf-cookie</code>, then <code>POST /api/v1/auth/login</code>. The browser then sends the session cookie, and every write sends the <code>XSRF-TOKEN</code> cookie value as the <code>X-XSRF-TOKEN</code> header.'
security:
  -
    default: []
paths:
  /api/v1/auth/logout:
    post:
      summary: 'Log out'
      operationId: logOut
      description: 'End the session and rotate the CSRF token.'
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF_TOKEN}'
          schema:
            type: string
      responses:
        204:
          description: 'Logged out'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        401:
          description: 'Not logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Auth
  /api/v1/auth/email/verification-notification:
    post:
      summary: 'Resend verification email'
      operationId: resendVerificationEmail
      description: 'Send the verification email again, with a fresh 60-minute link.'
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF_TOKEN}'
          schema:
            type: string
      responses:
        202:
          description: 'Email sent'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        401:
          description: 'Not logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        409:
          description: 'Already verified; nothing sent'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Your email is already verified.'
                  code: already_verified
                properties:
                  message:
                    type: string
                    example: 'Your email is already verified.'
                  code:
                    type: string
                    example: already_verified
        429:
          description: 'More than 6 tries in a minute'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Auth
  /api/v1/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Create an account, log it in, and send a verification email.'
      parameters: []
      responses:
        201:
          description: 'Account created and logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m86zetrpwzhy0854ykm0w36m
                    name: 'Mrs. Justina Gaylord'
                    username: deltvi9__k
                    email: theo.hauck@example.com
                    email_verified_at: '2026-11-24T14:30:48.000000Z'
                    created_at: '2026-11-24T14:30:48.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m86zetrpwzhy0854ykm0w36m
                        description: ULID.
                      name:
                        type: string
                        example: 'Mrs. Justina Gaylord'
                        description: 'Display name.'
                      username:
                        type: string
                        example: deltvi9__k
                        description: 'Lowercase @handle, unique.'
                      email:
                        type: string
                        example: theo.hauck@example.com
                        description: 'Email address, unique.'
                      email_verified_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC. Null until the email is verified.'
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC.'
                    required:
                      - id
                      - name
                      - username
                      - email
                      - email_verified_at
                      - created_at
        403:
          description: 'Already logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The username has already been taken.'
                  errors:
                    username:
                      - 'The username has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The username has already been taken.'
                  errors:
                    type: object
                    properties:
                      username:
                        type: array
                        example:
                          - 'The username has already been taken.'
                        items:
                          type: string
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: b
                username:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: correct-horse-battery
              required:
                - name
                - username
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/auth/login:
    post:
      summary: 'Log in'
      operationId: logIn
      description: 'Start a session. Limited to 5 tries a minute per email and IP.'
      parameters: []
      responses:
        200:
          description: 'Logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m86zets1dhh7w52yp3qzmfyy
                    name: 'Mrs. Justina Gaylord'
                    username: _folydlym
                    email: carey67@example.com
                    email_verified_at: '2026-11-24T14:30:48.000000Z'
                    created_at: '2026-11-24T14:30:48.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m86zets1dhh7w52yp3qzmfyy
                        description: ULID.
                      name:
                        type: string
                        example: 'Mrs. Justina Gaylord'
                        description: 'Display name.'
                      username:
                        type: string
                        example: _folydlym
                        description: 'Lowercase @handle, unique.'
                      email:
                        type: string
                        example: carey67@example.com
                        description: 'Email address, unique.'
                      email_verified_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC. Null until the email is verified.'
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC.'
                    required:
                      - id
                      - name
                      - username
                      - email
                      - email_verified_at
                      - created_at
        403:
          description: 'Already logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        422:
          description: 'Wrong email or password'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'These credentials do not match our records.'
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  message:
                    type: string
                    example: 'These credentials do not match our records.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
        429:
          description: 'Too many tries'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                remember:
                  type: boolean
                  description: ''
                  example: true
              required:
                - email
                - password
      security: []
  '/api/v1/auth/email/verify/{id}/{hash}':
    get:
      summary: 'Verify email'
      operationId: verifyEmail
      description: 'The link from the verification email. Opened in a browser, so it redirects to the web app instead of returning JSON. Works logged out: the signature proves the link came from us.'
      parameters:
        -
          in: query
          name: expires
          description: 'Unix time the link stops working (60 minutes after sending).'
          example: 1767225600
          required: true
          schema:
            type: integer
            description: 'Unix time the link stops working (60 minutes after sending).'
            example: 1767225600
        -
          in: query
          name: signature
          description: 'HMAC of the URL, made by the API.'
          example: b1946ac92492d2347c6235b4d2611184
          required: true
          schema:
            type: string
            description: 'HMAC of the URL, made by the API.'
            example: b1946ac92492d2347c6235b4d2611184
      responses:
        302:
          description: 'Verified (or already verified). Location: FRONTEND_URL/chats?verified=1'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        403:
          description: 'Signature changed, missing, or expired; or hash is not this email'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Invalid signature.'
                properties:
                  message:
                    type: string
                    example: 'Invalid signature.'
        404:
          description: 'Unknown user'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'No query results for model [App\Models\User].'
                properties:
                  message:
                    type: string
                    example: 'No query results for model [App\Models\User].'
        429:
          description: 'More than 6 tries in a minute'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Auth
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The user ID (ULID).'
        example: 01JD3F7K2Q8M4N5P6R7S8T9V0W
        required: true
        schema:
          type: string
      -
        in: path
        name: hash
        description: "sha1 of the user's email."
        example: a94a8fe5ccb19ba61c4c0873d391e987982fbbd3
        required: true
        schema:
          type: string
  /api/v1/auth/forgot-password:
    post:
      summary: 'Send password reset link'
      operationId: sendPasswordResetLink
      description: 'Email a 60-minute reset link if the address has an account. The reply is the same either way. Limited to 5 tries a minute per IP.'
      parameters: []
      responses:
        202:
          description: 'Accepted (sent, or no account with that email)'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        403:
          description: 'Already logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        422:
          description: 'Missing or bad email'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The email field is required.'
                  errors:
                    email:
                      - 'The email field is required.'
                properties:
                  message:
                    type: string
                    example: 'The email field is required.'
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email field is required.'
                        items:
                          type: string
        429:
          description: 'More than 5 tries in a minute'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/v1/auth/reset-password:
    post:
      summary: 'Reset password'
      operationId: resetPassword
      description: 'Set a new password with the token and email from the reset link. Ends every session and does not log in. Shares the forgot-password limit: 5 tries a minute per IP.'
      parameters: []
      responses:
        204:
          description: 'Password changed'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        403:
          description: 'Already logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This action is unauthorized.'
                properties:
                  message:
                    type: string
                    example: 'This action is unauthorized.'
        422:
          description: 'Bad reset link, or a missing or bad field'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'This reset link is invalid or has expired.'
                  errors:
                    token:
                      - 'This reset link is invalid or has expired.'
                properties:
                  message:
                    type: string
                    example: 'This reset link is invalid or has expired.'
                  errors:
                    type: object
                    properties:
                      token:
                        type: array
                        example:
                          - 'This reset link is invalid or has expired.'
                        items:
                          type: string
        429:
          description: 'More than 5 tries in a minute'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: correct-horse-battery
              required:
                - token
                - email
                - password
                - password_confirmation
      security: []
  /api/v1/me:
    get:
      summary: 'Current user'
      operationId: currentUser
      description: 'Who is logged in.'
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF_TOKEN}'
          schema:
            type: string
      responses:
        200:
          description: 'The logged-in user'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m86zetp8xvhab5h33t13z515
                    name: 'Morgan Hirthe'
                    username: folydlymqh9m
                    email: sleffler@example.org
                    email_verified_at: '2026-11-24T14:30:48.000000Z'
                    created_at: '2026-11-24T14:30:48.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m86zetp8xvhab5h33t13z515
                        description: ULID.
                      name:
                        type: string
                        example: 'Morgan Hirthe'
                        description: 'Display name.'
                      username:
                        type: string
                        example: folydlymqh9m
                        description: 'Lowercase @handle, unique.'
                      email:
                        type: string
                        example: sleffler@example.org
                        description: 'Email address, unique.'
                      email_verified_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC. Null until the email is verified.'
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC.'
                    required:
                      - id
                      - name
                      - username
                      - email
                      - email_verified_at
                      - created_at
        401:
          description: 'Not logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
      tags:
        - Account
    patch:
      summary: 'Update current user'
      operationId: updateCurrentUser
      description: 'Change your name and/or username. Send only the fields you want to change.'
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF_TOKEN}'
          schema:
            type: string
      responses:
        200:
          description: 'The updated user'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 01m86zetq7hwym3xesa5h195q9
                    name: 'Ms. Elisabeth Okuneva'
                    username: ka6z34de
                    email: cormier.nick@example.com
                    email_verified_at: '2026-11-24T14:30:48.000000Z'
                    created_at: '2026-11-24T14:30:48.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 01m86zetq7hwym3xesa5h195q9
                        description: ULID.
                      name:
                        type: string
                        example: 'Ms. Elisabeth Okuneva'
                        description: 'Display name.'
                      username:
                        type: string
                        example: ka6z34de
                        description: 'Lowercase @handle, unique.'
                      email:
                        type: string
                        example: cormier.nick@example.com
                        description: 'Email address, unique.'
                      email_verified_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC. Null until the email is verified.'
                        nullable: true
                      created_at:
                        type: string
                        example: '2026-11-24T14:30:48.000000Z'
                        description: 'ISO 8601 UTC.'
                    required:
                      - id
                      - name
                      - username
                      - email
                      - email_verified_at
                      - created_at
        401:
          description: 'Not logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        422:
          description: 'Validation failed'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The username has already been taken.'
                  errors:
                    username:
                      - 'The username has already been taken.'
                properties:
                  message:
                    type: string
                    example: 'The username has already been taken.'
                  errors:
                    type: object
                    properties:
                      username:
                        type: array
                        example:
                          - 'The username has already been taken.'
                        items:
                          type: string
      tags:
        - Account
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Your name. Max 255.'
                  example: 'Dara Sok'
                username:
                  type: string
                  description: '3 to 30 lowercase letters, numbers, or underscores. Trimmed and lowercased.'
                  example: dara_02
  /api/v1/me/password:
    put:
      summary: 'Change password'
      operationId: changePassword
      description: 'Set a new password by giving the current one. Keeps this session and ends every other one. 5 tries a minute per user.'
      parameters:
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF_TOKEN}'
          schema:
            type: string
      responses:
        204:
          description: 'Password changed'
          content:
            application/json:
              schema:
                type: object
                nullable: true
        401:
          description: 'Not logged in'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: Unauthenticated.
                properties:
                  message:
                    type: string
                    example: Unauthenticated.
        422:
          description: 'Wrong current password, or a missing or bad field'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'The password is incorrect.'
                  errors:
                    current_password:
                      - 'The password is incorrect.'
                properties:
                  message:
                    type: string
                    example: 'The password is incorrect.'
                  errors:
                    type: object
                    properties:
                      current_password:
                        type: array
                        example:
                          - 'The password is incorrect.'
                        items:
                          type: string
        429:
          description: 'More than 5 tries in a minute'
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Too Many Attempts.'
                properties:
                  message:
                    type: string
                    example: 'Too Many Attempts.'
      tags:
        - Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  description: 'Your password now.'
                  example: old-secret-password
                password:
                  type: string
                  description: 'The new password. Must differ from current_password.'
                  example: correct-horse-battery
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: correct-horse-battery
              required:
                - current_password
                - password
                - password_confirmation
  /api/v1/users:
    get:
      summary: 'Search users'
      operationId: searchUsers
      description: 'Find verified users by the start of their username, in username order. Never finds you. 60 searches a minute per user.'
      parameters:
        -
          in: query
          name: search
          description: '2 to 30 letters, numbers, or underscores. Trimmed and lowercased, and one leading @ is removed.'
          example: bo
          required: true
          schema:
            type: string
            description: '2 to 30 letters, numbers, or underscores. Trimmed and lowercased, and one leading @ is removed.'
            example: bo
        -
          in: query
          name: per_page
          description: 'Users per page, 1 to 100. Default 30.'
          example: 30
          required: false
          schema:
            type: integer
            description: 'Users per page, 1 to 100. Default 30.'
            example: 30
        -
          in: query
          name: cursor
          description: 'next_cursor or prev_cursor from the page before. Leave out for page 1.'
          example: null
          required: false
          schema:
            type: string
            description: 'next_cursor or prev_cursor from the page before. Leave out for page 1.'
            example: null
        -
          in: header
          name: X-XSRF-TOKEN
          description: ''
          example: '{XSRF_TOKEN}'
          schema:
            type: string
      responses:
        200:
          description: 'One page of users'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 01m86zetqpt5xg90egphkcgf94
                      name: 'Ms. Elisabeth Okuneva'
                      username: i9__kfao_f
                    -
                      id: 01m86zetqr0d177c138kw5sbt6
                      name: 'Mr. Oswald Koch'
                      username: o_75_mdi6
                  links:
                    first: null
                    last: null
                    prev: null
                    next: null
                  meta:
                    path: /
                    per_page: 30
                    next_cursor: null
                    prev_cursor: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 01m86zetqpt5xg90egphkcgf94
                        name: 'Ms. Elisabeth Okuneva'
                        username: i9__kfao_f
